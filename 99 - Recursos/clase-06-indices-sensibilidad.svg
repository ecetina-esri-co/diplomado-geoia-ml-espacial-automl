<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="t d"><title id="t">Los índices responden a contrastes distintos</title><desc id="d">Tres paneles de cálculos hipotéticos con reflectancias. A: NDVI y SAVI frente a NIR con rojo0.06. B: DVI y RVI para dos escalas comunes. C: MSI y MNDWI con dos pares de bandas. No son datos Coiba ni umbrales de clasificación.</desc><rect width="1100" height="650" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#17324d"><text x="35" y="40" font-size="26" font-weight="bold">Cambiar la banda cambia la pregunta</text><text x="35" y="72" font-size="17">Elaboración docente · reflectancias hipotéticas · sin unidades de biomasa</text><text x="55" y="118" font-size="21">A · NIR creciente; rojo = 0.06</text><g stroke="#cbd5e1" fill="none"><path d="M85 150V400H505M85 150H505M85 275H505"/></g><g font-size="16"><text x="45" y="406">0</text><text x="35" y="280">0.5</text><text x="45" y="157">1</text><text x="92" y="429">0.10</text><text x="270" y="429">0.30</text><text x="467" y="429">0.52</text><text x="280" y="455">NIR</text></g><polyline points="110,337.5 290,233.3 490,201.7" fill="none" stroke="#0f766e" stroke-width="4"/><polyline points="110,377.3 290,295.3 490,240.3" fill="none" stroke="#d97706" stroke-width="4"/><g fill="#0f766e"><circle cx="110" cy="337.5" r="5"/><circle cx="290" cy="233.3" r="5"/><circle cx="490" cy="201.7" r="5"/></g><g fill="#d97706"><circle cx="110" cy="377.3" r="5"/><circle cx="290" cy="295.3" r="5"/><circle cx="490" cy="240.3" r="5"/></g><text x="145" y="491" font-size="18" fill="#0f766e">NDVI: 0.250 → 0.793</text><text x="145" y="523" font-size="18" fill="#b45309">SAVI: 0.091 → 0.639 (L=0.5)</text><text x="585" y="118" font-size="21">B · Multiplicar NIR y rojo por dos</text><text x="585" y="157" font-size="18">(0.26, 0.03) → (0.52, 0.06)</text><text x="585" y="193" font-size="18">RVI: 8.667 → 8.667; NDVI no cambia.</text><text x="585" y="229" font-size="18">DVI: 0.230 → 0.460; se duplica.</text><text x="585" y="290" font-size="21">C · Razones de humedad y agua</text><text x="585" y="330" font-size="18">MSI: SWIR/NIR</text><text x="585" y="363" font-size="18">0.18/0.52 = 0.346; 0.30/0.26 = 1.154</text><text x="585" y="409" font-size="18">MNDWI: (verde−SWIR)/(verde+SWIR)</text><text x="585" y="442" font-size="18">(0.08−0.01)/(0.08+0.01) = 0.778</text><text x="585" y="475" font-size="18">(0.09−0.18)/(0.09+0.18) = −0.333</text><text x="55" y="579" font-size="18">EVI añade azul: con azul 0.05, rojo 0.06 y NIR 0.52 resulta 0.764.</text><text x="55" y="614" font-size="17">Las constantes de EVI y SAVI exigen una escala radiométrica coherente; NoData no es cero.</text></g></svg>
