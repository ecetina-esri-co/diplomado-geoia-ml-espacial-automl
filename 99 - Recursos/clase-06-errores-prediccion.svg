<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="t d">
<title id="t">Una misma predicción tiene magnitud y dirección de error</title><desc id="d">Ejemplo hipotético: observados 80,120,60 y predichos 75,130,50. Errores observado menos predicho: 5,-10,10. MAE 8.33 y RMSE 8.66 unidades.</desc>
<rect width="1000" height="440" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#17324d"><text x="40" y="38" font-size="25" font-weight="bold">Predecir no es medir: tres puntos hipotéticos</text><text x="40" y="66" font-size="16">Magnitudes en unidades de la respuesta; no son resultados Coiba.</text>
<g stroke="#cbd5e1"><path d="M160 100V330H780" fill="none"/><path d="M360 100V330M560 100V330M760 100V330"/></g>
<g font-size="16"><text x="155" y="355">0</text><text x="350" y="355">50</text><text x="545" y="355">100</text><text x="745" y="355">150</text><text x="95" y="143">P1</text><text x="95" y="218">P2</text><text x="95" y="293">P3</text></g>
<g fill="#0f766e"><rect x="160" y="115" width="320" height="20"/><rect x="160" y="190" width="480" height="20"/><rect x="160" y="265" width="240" height="20"/></g>
<g fill="#d97706"><rect x="160" y="138" width="300" height="20"/><rect x="160" y="213" width="520" height="20"/><rect x="160" y="288" width="200" height="20"/></g>
<g font-size="17"><text x="495" y="131">80</text><text x="475" y="155">75</text><text x="655" y="206">120</text><text x="695" y="230">130</text><text x="415" y="281">60</text><text x="375" y="306">50</text><text x="800" y="141">e = +5</text><text x="800" y="216">e = −10</text><text x="800" y="291">e = +10</text></g>
<rect x="80" y="385" width="18" height="18" fill="#0f766e"/><text x="108" y="400" font-size="16">Observado</text><rect x="240" y="385" width="18" height="18" fill="#d97706"/><text x="268" y="400" font-size="16">Predicho</text><text x="430" y="400" font-size="17">MAE = 8.33 · RMSE = 8.66 · error medio = 1.67</text>
</g></svg>
