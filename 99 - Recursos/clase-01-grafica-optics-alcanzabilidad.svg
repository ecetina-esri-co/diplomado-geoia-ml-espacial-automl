<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490"><rect width="1000" height="490" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#16324f"><text x="30" y="35" font-size="24">OPTICS: valles de alcanzabilidad, antes de extraer etiquetas</text><path d="M85 345V75 M85 345H945" stroke="#475569" stroke-width="2" fill="none"/><text x="95" y="80" font-size="17">Distancia de alcanzabilidad conceptual</text><path d="M105 100L140 130L165 265L200 285L235 280L270 290L310 265L340 130L380 105L425 145L455 215L490 225L525 220L560 245L595 230L630 215L665 140L700 115L730 180L760 295L800 305L840 290L875 155L915 110" fill="none" stroke="#2563eb" stroke-width="4"/><path d="M90 250H930" stroke="#c2410c" stroke-dasharray="8 5" stroke-width="2"/><text x="420" y="280" font-size="16" fill="#c2410c">Corte ilustrativo: no max_eps</text><text x="195" y="323" font-size="17">Valle A</text><text x="475" y="192" font-size="17">Valle B más alto</text><text x="770" y="335" font-size="17">Valle C</text><text x="260" y="380" font-size="18">Posición en el orden OPTICS → no tiempo ni geografía</text><text x="45" y="420" font-size="17">Otro criterio de extracción puede reconocer estructura que este corte no reúne.</text><text x="45" y="447" font-size="17">max_eps controla la búsqueda de vecindad; no representa el diámetro final de cada grupo.</text><text x="45" y="475" font-size="15">Perfil idealizado propio sin ejecución; scikit-learn 1.6 OPTICS, Attributes/max_eps/Notes (E9).</text></g></svg>
