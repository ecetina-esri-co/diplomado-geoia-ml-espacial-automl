<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-labelledby="title desc">
<title id="title">Moran: el signo de los productos entre vecinos</title>
<desc id="desc">Dos cadenas de cuatro sitios con valores uno y tres. Los vecinos tienen pesos binarios simétricos sin diagonal. La primera tiene I un tercio y la segunda I menos uno. No se calcula significancia.</desc>
<rect width="1100" height="580" fill="#f5f8fc"/>
<g font-family="Arial, sans-serif" fill="#183449">
<text x="35" y="42" font-size="27" font-weight="bold">Moran: mismos valores, distinta organización vecinal</text>
<text x="35" y="77" font-size="18">Ejemplo algebraico propio · cuatro sitios fijos · no es un mapa ni un resultado de práctica</text>
<g stroke="#647c8b" stroke-width="4"><path d="M130 185H650"/><path d="M130 345H650"/></g>
<g stroke="#fff" stroke-width="3"><circle cx="130" cy="185" r="29" fill="#147d92"/><circle cx="303" cy="185" r="29" fill="#147d92"/><circle cx="476" cy="185" r="29" fill="#b46423"/><circle cx="650" cy="185" r="29" fill="#b46423"/>
<circle cx="130" cy="345" r="29" fill="#147d92"/><circle cx="303" cy="345" r="29" fill="#b46423"/><circle cx="476" cy="345" r="29" fill="#147d92"/><circle cx="650" cy="345" r="29" fill="#b46423"/></g>
<g fill="#fff" font-size="23" text-anchor="middle"><text x="130" y="193">1</text><text x="303" y="193">1</text><text x="476" y="193">3</text><text x="650" y="193">3</text><text x="130" y="353">1</text><text x="303" y="353">3</text><text x="476" y="353">1</text><text x="650" y="353">3</text></g>
<g font-size="20"><text x="65" y="129">A. Valores similares contiguos</text><text x="65" y="289">B. Valores alternantes</text>
<text x="193" y="229">+1</text><text x="373" y="229">−1</text><text x="546" y="229">+1</text><text x="193" y="391">−1</text><text x="373" y="391">−1</text><text x="546" y="391">−1</text></g>
<rect x="725" y="115" width="335" height="285" rx="12" fill="#e3edf6"/>
<g font-size="19"><text x="745" y="150">Media = 2; desviaciones = ±1</text><text x="745" y="183">n = 4; S₀ = 6; Σ u² = 4</text><text x="745" y="225">A: suma dirigida = 2</text><text x="745" y="253">I = (4/6) × (2/4) = 1/3</text><text x="745" y="300">B: suma dirigida = −6</text><text x="745" y="328">I = (4/6) × (−6/4) = −1</text><text x="745" y="375">No se infiere z ni p.</text></g>
<text x="35" y="450" font-size="19">Cada arista cuenta en ambas direcciones. Productos: desviación de i × desviación de j.</text>
<text x="35" y="485" font-size="18">Pesos binarios simétricos, diagonal cero, sin estandarización por filas. Distancia no representada.</text>
<text x="35" y="530" font-size="16">Idea: Esri Pro 3.6, How Spatial Autocorrelation works, Interpretation.</text>
<text x="35" y="554" font-size="16">Cálculo docente: desarrollo formal en borrador; pendiente de cotejo primario, no de ejecución GIS.</text>
</g></svg>
