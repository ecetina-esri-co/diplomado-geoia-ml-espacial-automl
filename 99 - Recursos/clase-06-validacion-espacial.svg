<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="t d"><title id="t">Reservar registros no equivale a reservar territorio</title><desc id="d">Dos rejillas esquemáticas de 20 sitios. En una, cuatro sitios de validación están intercalados; en otra forman una columna contigua. No son mapas ni resultados reales.</desc><rect width="1000" height="450" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#17324d"><text x="35" y="40" font-size="25" font-weight="bold">¿Vecinos conocidos o un sector no visto?</text><text x="35" y="70" font-size="16">Esquema hipotético: cuatro sitios retenidos de veinte en cada panel (20%).</text><text x="90" y="112" font-size="21">Partición intercalada</text><text x="580" y="112" font-size="21">Sector retenido</text><g fill="#0f766e"><path d="M90 140h280v200H90zM580 140h280v200H580z"/></g><g fill="#d97706"><path d="M146 140h56v50h-56zM258 190h56v50h-56zM90 240h56v50H90zM202 290h56v50h-56zM804 140h56v200h-56z"/></g><g stroke="white" stroke-width="4"><path d="M146 140v200M202 140v200M258 140v200M314 140v200M90 190h280M90 240h280M90 290h280M636 140v200M692 140v200M748 140v200M804 140v200M580 190h280M580 240h280M580 290h280"/></g><text x="70" y="374" font-size="16">Validar cerca del entrenamiento</text><text x="557" y="374" font-size="16">Validar en un sector excluido</text><rect x="90" y="400" width="18" height="18" fill="#0f766e"/><text x="120" y="416" font-size="16">Entrenamiento</text><rect x="310" y="400" width="18" height="18" fill="#d97706"/><text x="340" y="416" font-size="16">Validación</text><text x="555" y="416" font-size="16">Sin coordenadas, distancias ni escala geográfica.</text></g></svg>
