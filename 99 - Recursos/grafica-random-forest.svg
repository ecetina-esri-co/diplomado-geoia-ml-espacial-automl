<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900">
  <rect width="1280" height="900" fill="#ffffff"/>
  <defs><marker id="arrowRF" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#16a34a"/></marker><style>.title{font-family:Arial,sans-serif;font-size:32px;font-weight:700;fill:#14532d}.subtitle{font-family:Arial,sans-serif;font-size:17px;fill:#475569}.h{font-family:Arial,sans-serif;font-size:18px;font-weight:700}.t{font-family:Arial,sans-serif;font-size:14px}.small{font-family:Arial,sans-serif;font-size:13px;fill:#475569}.boxTitle{font-family:Arial,sans-serif;font-size:18px;font-weight:700;fill:#0f172a}</style></defs>
  <text x="640" y="48" text-anchor="middle" class="title">Random Forest: muchos árboles para reducir fragilidad</text>
  <text x="640" y="80" text-anchor="middle" class="subtitle">Cada árbol aprende una versión parcial del problema; el bosque combina predicciones y permite revisar error e importancia de variables.</text>
  <rect x="55" y="120" width="785" height="660" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="95" y="205" width="210" height="130" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="200" y="245" text-anchor="middle" class="h" fill="#14532d">Datos de entrenamiento</text>
  <text x="200" y="275" text-anchor="middle" class="t" fill="#14532d">variables explicativas + objetivo</text>
  <text x="200" y="305" text-anchor="middle" class="small">distancia, semana, edad, vivienda...</text>
  <rect x="95" y="470" width="210" height="110" rx="16" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="200" y="508" text-anchor="middle" class="h" fill="#713f12">Aleatoriedad útil</text>
  <text x="200" y="536" text-anchor="middle" class="t" fill="#713f12">muestras + variables distintas</text>
  <text x="200" y="560" text-anchor="middle" class="small">evita depender de un solo árbol</text>
  <g text-anchor="middle">
    <rect x="410" y="150" width="180" height="105" rx="15" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/><text x="500" y="187" class="h" fill="#14532d">Árbol 1</text><text x="500" y="218" class="t" fill="#14532d">predice 5</text>
    <rect x="410" y="310" width="180" height="105" rx="15" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/><text x="500" y="347" class="h" fill="#14532d">Árbol 2</text><text x="500" y="378" class="t" fill="#14532d">predice 7</text>
    <rect x="410" y="470" width="180" height="105" rx="15" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/><text x="500" y="507" class="h" fill="#14532d">Árbol 3</text><text x="500" y="538" class="t" fill="#14532d">predice 6</text>
    <rect x="625" y="310" width="175" height="132" rx="18" fill="#ecfdf5" stroke="#15803d" stroke-width="3"/><text x="712" y="348" class="h" fill="#14532d">Predicción final</text><text x="712" y="382" class="t" fill="#14532d">regresión:</text><text x="712" y="410" class="h" fill="#14532d">(5+7+6)/3 = 6</text>
  </g>
  <path d="M305 265 C350 210 365 200 410 202" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#arrowRF)"/>
  <path d="M305 265 C360 320 365 355 410 362" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#arrowRF)"/>
  <path d="M305 525 C355 522 370 522 410 522" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#arrowRF)"/>
  <path d="M590 202 C635 235 665 275 690 310" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#arrowRF)"/>
  <path d="M590 362 L625 365" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#arrowRF)"/>
  <path d="M590 522 C645 500 685 465 705 442" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#arrowRF)"/>
  <rect x="110" y="650" width="690" height="90" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="455" y="682" text-anchor="middle" class="boxTitle">Interpretación clave</text>
  <text x="135" y="714" class="t" fill="#334155">Si el observado fue 8 y el bosque predijo 6, el residual es e = 8 - 6 = 2.</text>
  <text x="135" y="738" class="t" fill="#334155">Ese error debe revisarse por magnitud, patrón espacial y perfil de población, no solo como número global.</text>
  <rect x="885" y="120" width="330" height="210" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="1050" y="153" text-anchor="middle" class="boxTitle" fill="#1e3a8a">Métricas útiles</text>
  <text x="910" y="190" class="t" fill="#1e3a8a">Regresión: MAE, RMSE, R².</text>
  <text x="910" y="218" class="t" fill="#1e3a8a">Clasificación: precision, recall, F1, AUC.</text>
  <text x="910" y="246" class="t" fill="#1e3a8a">GeoIA: mapa de errores + Moran's I.</text>
  <text x="910" y="285" class="small">RMSE mayor que MAE suele revelar errores extremos.</text>
  <rect x="885" y="365" width="330" height="205" rx="18" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="1050" y="398" text-anchor="middle" class="boxTitle" fill="#9a3412">Importancia de variables</text>
  <rect x="925" y="430" width="220" height="20" fill="#16a34a"/><text x="1160" y="446" class="small">distancia 75%</text>
  <rect x="925" y="465" width="95" height="20" fill="#86efac"/><text x="1035" y="481" class="small">semana 15%</text>
  <rect x="925" y="500" width="55" height="20" fill="#bbf7d0"/><text x="995" y="516" class="small">edad 8%</text>
  <text x="910" y="550" class="small" fill="#7c2d12">Ayuda a explicar, pero NO prueba causalidad.</text>
  <rect x="885" y="610" width="330" height="170" rx="18" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="1050" y="643" text-anchor="middle" class="boxTitle" fill="#7f1d1d">Advertencias</text>
  <text x="910" y="680" class="t" fill="#7f1d1d">• No extrapola bien fuera del entrenamiento.</text>
  <text x="910" y="708" class="t" fill="#7f1d1d">• Puede ocultar sesgos de datos.</text>
  <text x="910" y="736" class="t" fill="#7f1d1d">• Más árboles ≠ más explicación causal.</text>
</svg>
