<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490"><rect width="1000" height="490" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#16324f"><text x="30" y="35" font-size="24">HDBSCAN: persistencia en una jerarquía y extracción plana</text><path d="M80 365V75 M80 365H920" stroke="#475569" stroke-width="2" fill="none"/><text x="90" y="80" font-size="17">Mayor densidad (λ = 1 / distancia)</text><text x="90" y="350" font-size="17">Menor densidad</text><g fill="none" stroke-linecap="round"><path d="M500 340V290 M500 290L275 245V140 M500 290L705 230V100" stroke="#0f766e" stroke-width="22"/><path d="M275 205L185 175V145 M275 205L365 155V125" stroke="#5eead4" stroke-width="10"/><path d="M705 165L625 130V105 M705 165L795 115V85" stroke="#5eead4" stroke-width="10"/><path d="M500 295L520 265V250" stroke="#94a3b8" stroke-width="5"/></g><rect x="120" y="110" width="295" height="145" rx="15" fill="none" stroke="#c2410c" stroke-width="3" stroke-dasharray="8 5"/><rect x="570" y="70" width="270" height="170" rx="15" fill="none" stroke="#c2410c" stroke-width="3" stroke-dasharray="8 5"/><text x="190" y="285" font-size="18">Grupo seleccionado A</text><text x="620" y="270" font-size="18">Grupo seleccionado B</text><text x="420" y="220" font-size="16">Rama breve</text><text x="150" y="395" font-size="17">Horizontal: disposición de ramas, no coordenada espacial ni tamaño medido.</text><text x="45" y="427" font-size="17">Condensar por tamaño mínimo y seleccionar estabilidad no equivale a cortar a una altura fija.</text><text x="45" y="453" font-size="17">PROB individual no reemplaza el árbol; ramas y selección aquí son ilustrativas, no calculadas.</text><text x="45" y="478" font-size="15">Elaboración propia; How HDBSCAN Works, documentación 0.8.1, pasos del algoritmo (E5).</text></g></svg>
