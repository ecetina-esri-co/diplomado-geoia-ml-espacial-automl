<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="530" viewBox="0 0 1000 530" role="img" aria-labelledby="t d"><title id="t">Importancia predictiva y promedio de árboles</title><desc id="d">Izquierda: ejemplo hipotético parcial de importancia relativa,NIR34,elevación22,pendiente17,NDVI9,aspecto6 por ciento;resto12 no mostrado. Derecha: árboles predicen5,7,6; promedio6; observado8; residual2.</desc><rect width="1000" height="530" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#17324d"><text x="35" y="40" font-size="25" font-weight="bold">Un bosque predice; un ranking no explica causas</text><text x="35" y="72" font-size="17">Dos ejemplos hipotéticos independientes, no salidas de Coiba</text><g stroke="#cbd5e1"><path d="M170 130V370H540M340 130V370M510 130V370" fill="none"/></g><g fill="#0f766e"><rect x="170" y="140" width="289" height="28"/><rect x="170" y="185" width="187" height="28"/><rect x="170" y="230" width="144.5" height="28"/><rect x="170" y="275" width="76.5" height="28"/><rect x="170" y="320" width="51" height="28"/></g><g font-size="17"><text x="70" y="162">NIR</text><text x="70" y="207">Elevación</text><text x="70" y="252">Pendiente</text><text x="70" y="297">NDVI</text><text x="70" y="342">Aspecto</text><text x="466" y="162">34</text><text x="364" y="207">22</text><text x="321" y="252">17</text><text x="254" y="297">9</text><text x="229" y="342">6</text><text x="165" y="397">0</text><text x="330" y="397">20</text><text x="500" y="397">40 %</text><text x="65" y="435">Ranking parcial: otras variables suman 12%.</text></g><text x="620" y="140" font-size="21">Promedio en regresión</text><g font-size="21"><text x="650" y="195">Árbol 1: 5</text><text x="650" y="235">Árbol 2: 7</text><text x="650" y="275">Árbol 3: 6</text><text x="610" y="332">Bosque = (5+7+6)/3 = 6</text><text x="610" y="375">Observado 8 → error +2</text></g><text x="40" y="490" font-size="18">La importancia depende del conjunto de predictores; promediar árboles no elimina el sesgo compartido.</text></g></svg>
