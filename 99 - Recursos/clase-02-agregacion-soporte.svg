<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="490" viewBox="0 0 1100 490" role="img" aria-labelledby="title desc">
<title id="title">Collect Events: coincidencias XY exactas, sin desplazar</title>
<desc id="desc">Tres coordenadas ocupadas contienen uno, dos y tres eventos. Anillos concéntricos representan registros exactamente coincidentes, no posiciones próximas. Collect Events conserva las coordenadas y suma seis eventos en ICOUNT.</desc>
<rect width="1100" height="490" fill="#f5f8fc"/>
<g font-family="Arial, sans-serif" fill="#183449">
<text x="35" y="42" font-size="26" font-weight="bold">Contar coincidencias exactas no modifica las coordenadas</text>
<text x="35" y="77" font-size="18">Elaboración propia · seis eventos inventados · esquema sin escala geográfica</text>
<rect x="35" y="105" width="390" height="235" rx="12" fill="#e3edf6"/><rect x="675" y="105" width="390" height="235" rx="12" fill="#e3edf6"/>
<g font-size="21" font-weight="bold"><text x="60" y="140">Antes: seis registros</text><text x="695" y="140">Después: tres sitios</text></g>
<g fill="none" stroke="#148082" stroke-width="3"><circle cx="110" cy="210" r="10"/><circle cx="238" cy="230" r="10"/><circle cx="238" cy="230" r="17"/><circle cx="350" cy="278" r="10"/><circle cx="350" cy="278" r="17"/><circle cx="350" cy="278" r="24"/></g>
<g fill="#148082"><circle cx="750" cy="210" r="10"/><circle cx="878" cy="230" r="17"/><circle cx="990" cy="278" r="24"/></g>
<g font-size="18"><text x="100" y="248">1</text><text x="230" y="269">2</text><text x="343" y="322">3</text><text x="742" y="248">1</text><text x="870" y="269">2</text><text x="983" y="322">3</text></g>
<path d="M455 223H645M632 211L645 223L632 235" fill="none" stroke="#c66c22" stroke-width="4"/>
<g font-size="18" text-anchor="middle"><text x="550" y="173">Collect Events</text><text x="550" y="199">XY idénticas</text><text x="550" y="263">crea ICOUNT</text><text x="550" y="290">sin Integrate</text></g>
<text x="35" y="375" font-size="19">Anillos = registros en la misma XY. No representan distancias ni tolerancias.</text>
<text x="35" y="410" font-size="19">ICOUNT: 1 + 2 + 3 = 6 eventos; tres sitios ocupados, sin inventar sitios con cero.</text>
<text x="35" y="455" font-size="16">Fuente conceptual: Esri, ArcGIS Pro 3.6, Collect Events, Usage (consulta 2026-09-15).</text>
</g></svg>
