<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470"><rect width="1000" height="470" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#16324f"><text x="30" y="35" font-size="24">Vecindad local no es diámetro del grupo</text><path d="M65 340V75 M65 340H945" stroke="#475569" stroke-width="2" fill="none"/><text x="30" y="85" font-size="18">Y</text><text x="915" y="365" font-size="18">X</text><circle cx="255" cy="225" r="100" stroke="#2563eb" fill="#dbeafe" stroke-dasharray="8 5"/><path d="M255 225L355 225" stroke="#2563eb" stroke-width="2"/><text x="300" y="213" font-size="22">ε</text><path d="M255 225L340 205L420 230L500 205L580 225L660 205" stroke="#0f766e" stroke-width="5" fill="none"/><g fill="#0f766e" stroke="#ffffff" stroke-width="2"><circle cx="255" cy="225" r="13"/><circle cx="340" cy="205" r="13"/><circle cx="420" cy="230" r="13"/><circle cx="500" cy="205" r="13"/><circle cx="580" cy="225" r="13"/><circle cx="660" cy="205" r="13"/></g><circle cx="165" cy="250" r="10" fill="#d97706"/><text x="100" y="290" font-size="18">Frontera</text><path d="M840 110L860 130 M860 110L840 130" stroke="#111827" stroke-width="4"/><text x="795" y="155" font-size="18">Ruido</text><text x="220" y="100" font-size="18">Vecindad de un núcleo</text><text x="430" y="285" font-size="18">Cadena de núcleos: extensión mayor que ε</text><path d="M165 315H670" stroke="#475569" stroke-width="2"/><text x="45" y="400" font-size="17">Esquema de roles: cada núcleo supone vecindario suficiente, incluidos vecinos no dibujados.</text><text x="45" y="430" font-size="17">No calcular MinPts contando estos símbolos. Frontera no prolonga la cadena por sí sola.</text><text x="45" y="457" font-size="15">Elaboración propia no observacional; Esri Pro 3.6 E2 y scikit-learn 1.6 E3. Ejes sin unidades reales.</text></g></svg>
