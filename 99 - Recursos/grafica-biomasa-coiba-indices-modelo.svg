<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Biomasa en Coiba: de índices y topografía a Random Forest</title>
  <desc id="desc">Flujo conceptual que conecta puntos AGBD, bandas Landsat, índices espectrales, DEM, pendiente y Random Forest para estimar biomasa.</desc>
  <rect width="1100" height="620" fill="#f7fbf7"/>
  <text x="550" y="48" text-anchor="middle" font-family="Segoe UI, Arial" font-size="29" font-weight="700" fill="#173b2f">Biomasa AGBD: estimación indirecta con rasters explicativos</text>
  <text x="550" y="80" text-anchor="middle" font-family="Segoe UI, Arial" font-size="15" fill="#47635a">El modelo aprende una relación empírica entre puntos de biomasa y señales ópticas/topográficas.</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker>
  </defs>

  <g font-family="Segoe UI, Arial" font-size="15">
    <rect x="55" y="145" width="210" height="115" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="160" y="178" text-anchor="middle" font-size="18" font-weight="700" fill="#14532d">Puntos AGBD</text>
    <text x="160" y="207" text-anchor="middle" fill="#14532d">biomasa observada</text>
    <text x="160" y="232" text-anchor="middle" fill="#14532d">respuesta del modelo</text>

    <rect x="55" y="340" width="210" height="115" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="160" y="373" text-anchor="middle" font-size="18" font-weight="700" fill="#1d4ed8">Bandas Landsat</text>
    <text x="160" y="402" text-anchor="middle" fill="#1d4ed8">B1–B7</text>
    <text x="160" y="427" text-anchor="middle" fill="#1d4ed8">reflectancia óptica</text>

    <rect x="325" y="245" width="220" height="115" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="435" y="278" text-anchor="middle" font-size="18" font-weight="700" fill="#92400e">Índices derivados</text>
    <text x="435" y="307" text-anchor="middle" fill="#92400e">NDVI, EVI, SAVI</text>
    <text x="435" y="332" text-anchor="middle" fill="#92400e">MSI, MNDWI, RVI, DVI</text>

    <rect x="325" y="420" width="220" height="95" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="435" y="454" text-anchor="middle" font-size="18" font-weight="700" fill="#5b21b6">Topografía</text>
    <text x="435" y="483" text-anchor="middle" fill="#5b21b6">DEM, pendiente, aspecto</text>

    <rect x="625" y="245" width="205" height="125" rx="18" fill="#ffffff" stroke="#0f766e" stroke-width="3"/>
    <text x="727" y="286" text-anchor="middle" font-size="20" font-weight="700" fill="#115e59">Random Forest</text>
    <text x="727" y="318" text-anchor="middle" fill="#115e59">aprende relaciones</text>
    <text x="727" y="343" text-anchor="middle" fill="#115e59">no causalidad directa</text>

    <rect x="890" y="145" width="160" height="115" rx="16" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
    <text x="970" y="178" text-anchor="middle" font-size="18" font-weight="700" fill="#115e59">Predicción</text>
    <text x="970" y="207" text-anchor="middle" fill="#115e59">raster AGBD</text>
    <text x="970" y="232" text-anchor="middle" fill="#115e59">celda por celda</text>

    <rect x="880" y="360" width="180" height="120" rx="16" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="970" y="393" text-anchor="middle" font-size="18" font-weight="700" fill="#991b1b">Advertencias</text>
    <text x="970" y="422" text-anchor="middle" fill="#991b1b">saturación óptica</text>
    <text x="970" y="447" text-anchor="middle" fill="#991b1b">extrapolación</text>
    <text x="970" y="472" text-anchor="middle" fill="#991b1b">validación espacial</text>
  </g>

  <g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M265 203 C480 110, 615 160, 690 245"/>
    <path d="M265 398 C320 398, 340 360, 390 340"/>
    <path d="M545 303 L625 303"/>
    <path d="M545 468 C610 468, 635 370, 665 365"/>
    <path d="M830 303 C870 303, 875 220, 890 203"/>
    <path d="M830 335 C875 350, 890 380, 900 398"/>
  </g>

  <rect x="180" y="550" width="740" height="42" rx="12" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="550" y="576" text-anchor="middle" font-family="Segoe UI, Arial" font-size="15" fill="#075985">Con los datos disponibles aplica como práctica exploratoria: útil para aprender, todavía no como mapa final confiable sin validación adicional.</text>
</svg>
