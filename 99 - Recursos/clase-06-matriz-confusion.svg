<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="t d"><title id="t">Exactitud no es precisión de la clase positiva</title><desc id="d">Ejemplo hipotético de 100 zonas, filas reales y columnas predichas. 18 verdaderos positivos,7 falsos negativos,10 falsos positivos,65 verdaderos negativos. Exactitud83%,precision64.3%,recall72%.</desc><rect width="1000" height="460" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#17324d"><text x="35" y="40" font-size="25" font-weight="bold">Cien zonas hipotéticas · clase positiva: crítica</text><text x="250" y="100" font-size="19">Predicha crítica</text><text x="452" y="100" font-size="19">Predicha no crítica</text><rect x="235" y="120" width="195" height="110" fill="#b9e4d9"/><rect x="435" y="120" width="195" height="110" fill="#ffdbb0"/><rect x="235" y="235" width="195" height="110" fill="#ffdbb0"/><rect x="435" y="235" width="195" height="110" fill="#b9e4d9"/><g font-size="19"><text x="35" y="182">Real crítica</text><text x="35" y="297">Real no crítica</text></g><g text-anchor="middle" font-size="27"><text x="332" y="182">VP = 18</text><text x="532" y="182">FN = 7</text><text x="332" y="297">FP = 10</text><text x="532" y="297">VN = 65</text></g><g font-size="20"><text x="675" y="167">Exactitud = 83 / 100</text><text x="675" y="220">Precision = 18 / 28</text><text x="675" y="273">Recall = 18 / 25</text></g><text x="45" y="395" font-size="18">Las filas fijan la realidad; las columnas fijan la decisión del modelo.</text><text x="45" y="428" font-size="18">Contar aciertos no localiza los errores ni define cuánto cuesta omitir una zona crítica.</text></g></svg>
