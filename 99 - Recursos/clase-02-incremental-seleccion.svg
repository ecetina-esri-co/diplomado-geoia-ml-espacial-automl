<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570" role="img" aria-labelledby="title desc">
<title id="title">Diez bandas y selección descriptiva de escala</title>
<desc id="desc">Curva sintética de z entre cien y mil metros con picos a cuatrocientos y ochocientos metros. Una referencia bilateral normal de 1.96 es nominal y no corrige seleccionar el máximo entre distancias.</desc>
<rect width="1100" height="570" fill="#f5f8fc"/>
<g font-family="Arial, sans-serif" fill="#183449">
<text x="35" y="42" font-size="27" font-weight="bold">La curva completa enseña más que el pico elegido</text>
<text x="35" y="77" font-size="18">Elaboración propia · z inventados para enseñar; no son resultados de abejas ni colegios</text>
<path d="M95 115V365H725" stroke="#183449" stroke-width="2" fill="none"/>
<g font-size="17"><text x="60" y="369">0</text><text x="60" y="299">1</text><text x="60" y="229">2</text><text x="60" y="159">3</text><text x="100" y="108">z (sin unidades)</text></g>
<path d="M95 228H725" stroke="#b46423" stroke-width="2" stroke-dasharray="8 6"/>
<polyline points="120,351 185,309 250,267 315,197 380,239 445,211 510,183 575,141 640,190 705,218" fill="none" stroke="#148082" stroke-width="4"/>
<g fill="#148082"><circle cx="120" cy="351" r="5"/><circle cx="185" cy="309" r="5"/><circle cx="250" cy="267" r="5"/><circle cx="315" cy="197" r="5"/><circle cx="380" cy="239" r="5"/><circle cx="445" cy="211" r="5"/><circle cx="510" cy="183" r="5"/><circle cx="575" cy="141" r="5"/><circle cx="640" cy="190" r="5"/><circle cx="705" cy="218" r="5"/></g>
<g font-size="16" text-anchor="middle"><text x="120" y="391">100</text><text x="185" y="391">200</text><text x="250" y="391">300</text><text x="315" y="391">400</text><text x="380" y="391">500</text><text x="445" y="391">600</text><text x="510" y="391">700</text><text x="575" y="391">800</text><text x="640" y="391">900</text><text x="705" y="391">1000</text></g>
<text x="250" y="423" font-size="18">Umbral de distancia acumulativa (m)</text>
<rect x="755" y="115" width="310" height="305" rx="12" fill="#e3edf6"/>
<g font-size="18"><text x="775" y="147" font-weight="bold">Lectura responsable</text><text x="775" y="183">Línea: z = 1.96 nominal.</text><text x="775" y="217">400 m: primer pico local.</text><text x="775" y="251">800 m: máximo ilustrativo.</text><text x="775" y="292">Las diez pruebas comparten</text><text x="775" y="318">datos y vecinos.</text><text x="775" y="358">El máximo no confirma</text><text x="775" y="384">su propia selección.</text></g>
<text x="35" y="464" font-size="19">Candidato territorial ≠ radio automático de OPTICS ≠ evidencia causal.</text>
<text x="35" y="503" font-size="17">Límite: la línea no ajusta comparaciones múltiples ni certifica la aproximación normal.</text>
<text x="35" y="539" font-size="16">Ideas: secuencia incremental de Clase 14; desarrollo de postselección pendiente de cotejo primario.</text>
</g></svg>
